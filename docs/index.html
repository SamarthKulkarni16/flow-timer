<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flow Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --ink: #f0ede8;
    --dim: #555550;
    --line: #222220;
    --mid: #888882;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    height: 100%;
    overflow: hidden;
  }
  body {
    height: 100dvh;
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding: 5vh 8vw;
    text-align: center;
  }

  .title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(14px, 3.5vw, 18px);
    font-weight: 300;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--mid);
    line-height: 1;
  }

  .timer-wrap {
    position: relative;
    width: clamp(130px, 34vw, 175px);
    height: clamp(130px, 34vw, 175px);
    flex-shrink: 0;
  }

  .timer-ring {
    width: 100%;
    height: 100%;
  }

  .ring-track {
    fill: none;
    stroke: var(--line);
    stroke-width: 3.5;
  }

  .ring-progress {
    fill: none;
    stroke: #ffffff;
    stroke-width: 3.5;
    stroke-linecap: butt;
    transform: rotate(-90deg);
    transform-origin: center;
  }

  .timer-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .timer-clock {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(26px, 7vw, 34px);
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--ink);
    line-height: 1;
    text-align: center;
  }

  .desc {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1em;
    max-width: 255px;
  }

  .desc .step {
    font-size: clamp(10px, 2.6vw, 11.5px);
    line-height: 1.8;
    color: var(--dim);
    letter-spacing: 0.05em;
  }

  .desc .accent {
    color: var(--mid);
  }

  .desc hr {
    border: none;
    width: 18px;
    height: 1px;
    background: var(--line);
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: min(240px, 65vw);
    height: clamp(42px, 6vh, 50px);
    background: transparent;
    color: var(--mid);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 300;
    font-size: clamp(10px, 2.6vw, 12px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    border-radius: 2px;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }

  .download-btn:active {
    border-color: var(--mid);
    color: var(--ink);
  }
</style>
</head>
<body>

  <div class="title">Flow Timer</div>

  <div class="timer-wrap">
    <svg class="timer-ring" viewBox="0 0 200 200">
      <circle class="ring-track" cx="100" cy="100" r="88"></circle>
      <circle id="ringProgress" class="ring-progress" cx="100" cy="100" r="88"></circle>
    </svg>
    <div class="timer-display">
      <div class="timer-clock" id="clock">20:00</div>
    </div>
  </div>

  <div class="desc">
    <div class="step">Name your task, set your time,<br>enter task count — then focus.</div>
    <hr>
    <div class="step"><span class="accent">Tap anywhere</span> to mark a task complete.</div>
    <hr>
    <div class="step">Triple tap the home screen<br>to view history.</div>
  </div>

  <a class="download-btn" href="https://github.com/SamarthKulkarni16/flow-timer/releases/download/v1.0.0/app-release.apk" download>
    Download
  </a>

<script>
  const TOTAL_SECONDS = 20 * 60;
  let secondsLeft = TOTAL_SECONDS;
  const clockEl = document.getElementById('clock');
  const ring = document.getElementById('ringProgress');

  const R = 88;
  const CIRCUMFERENCE = 2 * Math.PI * R;
  ring.setAttribute('stroke-dasharray', CIRCUMFERENCE);
  ring.setAttribute('stroke-dashoffset', 0);

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function render() {
    clockEl.textContent = formatTime(secondsLeft);
    const elapsed = TOTAL_SECONDS - secondsLeft;
    const offset = (elapsed / TOTAL_SECONDS) * CIRCUMFERENCE;
    ring.setAttribute('stroke-dashoffset', offset);
  }

  render();

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduced) {
    setInterval(() => {
      if (secondsLeft > 0) secondsLeft -= 1;
      else secondsLeft = TOTAL_SECONDS;
      render();
    }, 1000);
  }
</script>

</body>
</html>
